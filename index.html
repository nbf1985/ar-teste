<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Feliz Natal – Realidade Aumentada</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
    #container { position: absolute; inset: 0; z-index: 0; } /* z-index 0 mantém o vídeo da câmera visível */
    #overlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 24px; background: radial-gradient(circle at 50% 30%, #1b5e20, #0b2e12 70%); color: #fff; text-align: center;
    }
    #overlay h1 { font-size: 26px; margin: 0; }
    #overlay p { margin: 0; opacity: .85; max-width: 320px; line-height: 1.45; }
    .botao { font-size: 18px; padding: 14px 32px; border: 0; border-radius: 999px; background: #fff; color: #b71c1c; font-weight: 700; }
    .botao:disabled { opacity: .5; }
    #status { position: absolute; left: 0; right: 0; top: 20px; z-index: 5; text-align: center; color: #fff; font-size: 16px; text-shadow: 0 1px 4px #000; pointer-events: none; }
    #repetir { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 6; display: none; }
  </style>

  <!-- Bibliotecas open source: Three.js 0.160 (o MindAR 1.2.5 não funciona com Three.js 0.162+) e MindAR 1.2.5 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>

  <div id="overlay">
    <h1>🎅 Surpresa de Natal</h1>
    <p>Deixe o porta-copos em cima da mesa, toque em Começar e aponte a câmera para ele, com o celular meio inclinado.</p>
    <button id="startBtn" class="botao" disabled>Carregando…</button>
  </div>

  <div id="status"></div>
  <button id="repetir" class="botao">↺ Ver de novo</button>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { CenaNatal } from './natal.js';

    // Estabilidade (menos tremor). Dá para testar outros valores pelo link, ex.: ?cf=0.0003&beta=0.005
    const qs = new URLSearchParams(location.search);
    const filterMinCF = parseFloat(qs.get('cf') ?? '0.0005');  // menor = mais estável (e um pouco mais lento)
    const filterBeta  = parseFloat(qs.get('beta') ?? '0.01');  // maior = acompanha mais rápido quando o celular mexe

    const statusEl = document.getElementById('status');
    const overlay  = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const repetir  = document.getElementById('repetir');
    window.arState = { started: false, targetFound: false, error: null, t: 0 }; // usado nos testes

    const mindarThree = new MindARThree({
      container: document.getElementById('container'),
      imageTargetSrc: './assets/porta-copos.mind',
      uiScanning: 'no',
      filterMinCF, filterBeta,
    });
    const { renderer, scene, camera } = mindarThree;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
    const sol = new THREE.DirectionalLight(0xffffff, 2);
    sol.position.set(0.5, 1, 1);
    scene.add(sol);

    const anchor = mindarThree.addAnchor(0);
    const cena = new CenaNatal();
    anchor.group.add(cena.raiz);

    let alvoVisivel = false;
    anchor.onTargetFound = () => { alvoVisivel = true; statusEl.textContent = ''; window.arState.targetFound = true; };
    anchor.onTargetLost  = () => { alvoVisivel = false; statusEl.textContent = 'Aponte a câmera para o porta-copos'; };

    cena.carregarTexto('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json')
      .then(() => { startBtn.disabled = false; startBtn.textContent = 'Começar'; })
      .catch((e) => fail('Não consegui carregar a cena.', e));

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Abrindo câmera…';
      try {
        await mindarThree.start();
        overlay.style.display = 'none';
        statusEl.textContent = 'Aponte a câmera para o porta-copos';
        window.arState.started = true;
        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          const dt = Math.min(clock.getDelta(), 0.1);
          if (alvoVisivel) {                 // a história só anda enquanto o porta-copos está na tela
            cena.atualizar(dt, camera);
            window.arState.t = cena.t;
            if (cena.terminou) repetir.style.display = 'block';
          }
          renderer.render(scene, camera);
        });
      } catch (e) {
        fail('Não consegui abrir a câmera. Confira se deu permissão e se a página está em HTTPS.', e);
      }
    });

    repetir.addEventListener('click', () => {
      repetir.style.display = 'none';
      cena.reiniciar();
    });

    function fail(msg, e) {
      console.error(e);
      window.arState.error = String(e && e.message || e);
      overlay.style.display = 'flex';
      overlay.querySelector('p').textContent = msg;
      startBtn.style.display = 'none';
    }
  </script>
</body>
</html>
